\* expect: pass
\* Tick loops that keep up, with no stall: no run is skipped while a process
\* is up across it, nor inserted twice.
SPECIFICATION Spec
CONSTANTS
    Procs = {a, b}
    Period = 2
    Keep = 3
    Margin = 1
    Stall = 0
    MaxTime = 8
    Prompt = TRUE
    MutNoMargin = FALSE
    MutNoDedupe = FALSE
INVARIANTS
    TypeOK
    NoDuplicateTick
    NoSkippedTickWhileUp
