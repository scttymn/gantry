\* expect: violates AttemptsNonNegative
\* bfc43db's fence put back, the other way: a worker stalled past Dead,
\* whose job maintenance failed for its last crash and someone then retried,
\* puts the retried job back and takes its attempts to -1.
SPECIFICATION Spec
CONSTANTS
    Procs = {a, b}
    Slots = {1}
    MaxAttempts = 1
    MaxCrashes = 1
    Dead = 2
    HB = 1
    MaxTime = 4
    Crashes = FALSE
    CommitErrors = FALSE
    SettleErrors = TRUE
    MutNoCrashCount = FALSE
    MutBeatStopsOnShutdown = FALSE
    MutNoSettleRetry = FALSE
    MutFoundBeforeCommit = FALSE
    MutNoOrphanRelease = FALSE
    MutRetryFenceClaimed = FALSE
    MutStaleFence = TRUE
    Stalls = TRUE
SYMMETRY Sym
CONSTRAINT Bound
INVARIANT AttemptsNonNegative
