\* expect: violates NoStuckClaim
\* No orphan release: a claim whose commit errored but went through stays
\* claimed by its live process, which never runs it.
SPECIFICATION Spec
CONSTANTS
    Procs = {a, b}
    Slots = {1, 2}
    MaxAttempts = 1
    MaxCrashes = 2
    Dead = 2
    HB = 1
    MaxTime = 5
    Crashes = TRUE
    CommitErrors = TRUE
    SettleErrors = TRUE
    MutNoCrashCount = FALSE
    MutBeatStopsOnShutdown = FALSE
    MutNoSettleRetry = FALSE
    MutFoundBeforeCommit = FALSE
    MutNoOrphanRelease = TRUE
    MutRetryFenceClaimed = FALSE
    MutStaleFence = FALSE
    Stalls = FALSE
SYMMETRY Sym
CONSTRAINT Bound
INVARIANT NoStuckClaim
