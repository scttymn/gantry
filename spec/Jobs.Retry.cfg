\* expect: pass
\* Retry.Attempts 2, so a failed run is tried again: its settle back to
\* ready with a later run_at, kept and retried when it errors. The main run
\* has one attempt (the retry kind costs three times its states there).
\* Crashes, claims' commit errors and a second slot, which the retry kind
\* doesn't need, are the main run's; MaxTime 3 has a claim, its failure, the
\* settle and the next claim. Jobs.ReachRetryWait.cfg and
\* Jobs.ReachRetryKept.cfg show the retry settle saved and kept.
SPECIFICATION Spec
CONSTANTS
    Procs = {a, b}
    Slots = {1}
    MaxAttempts = 2
    MaxCrashes = 2
    Dead = 2
    HB = 1
    MaxTime = 3
    Crashes = FALSE
    CommitErrors = FALSE
    SettleErrors = TRUE
    MutNoCrashCount = FALSE
    MutBeatStopsOnShutdown = FALSE
    MutNoSettleRetry = FALSE
    MutFoundBeforeCommit = FALSE
    MutNoOrphanRelease = FALSE
    MutRetryFenceClaimed = FALSE
    MutStaleFence = FALSE
    Stalls = FALSE
SYMMETRY Sym
CONSTRAINT Bound
INVARIANTS
    TypeOK
    NoConcurrentExecution
    AttemptsBounded
    CrashLoopBounded
    NoStuckClaim
    NoAvoidableRerun
    ExhaustedOnce
    FailedRunsOnExhausted
    AttemptsNonNegative
