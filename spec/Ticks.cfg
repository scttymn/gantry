\* expect: pass
\* A tick's transaction waits up to Stall after its clock read, within
\* Margin; a process may sit on a due time (Prompt off).
SPECIFICATION Spec
CONSTANTS
    Procs = {a, b}
    Period = 2
    Keep = 3
    Margin = 1
    Stall = 1
    MaxTime = 8
    Prompt = FALSE
    MutNoMargin = FALSE
    MutNoDedupe = FALSE
INVARIANTS
    TypeOK
    NoDuplicateTick
