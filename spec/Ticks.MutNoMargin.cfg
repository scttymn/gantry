\* expect: violates NoDuplicateTick
\* B5 put back: maintenance deletes ticks at Keep, and a stalled tick runs
\* its due time a second time.
SPECIFICATION Spec
CONSTANTS
    Procs = {a, b}
    Period = 2
    Keep = 3
    Margin = 1
    Stall = 1
    MaxTime = 8
    Prompt = FALSE
    MutNoMargin = TRUE
    MutNoDedupe = FALSE
INVARIANT NoDuplicateTick
