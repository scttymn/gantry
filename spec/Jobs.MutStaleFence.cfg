\* expect: violates ExhaustedOnce
\* bfc43db's fence put back: a worker stalled past Dead, whose job
\* maintenance failed for its last crash, settles the failed row and runs
\* OnExhausted a second time.
SPECIFICATION Spec
CONSTANTS
    Procs = {a, b}
    Slots = {1}
    MaxAttempts = 1
    MaxCrashes = 2
    Dead = 2
    HB = 1
    MaxTime = 4
    Crashes = FALSE
    CommitErrors = FALSE
    SettleErrors = TRUE
    MutNoCrashCount = FALSE
    MutBeatStopsOnShutdown = FALSE
    MutNoSettleRetry = FALSE
    MutFoundBeforeCommit = FALSE
    MutNoOrphanRelease = FALSE
    MutRetryFenceClaimed = FALSE
    MutStaleFence = TRUE
    Stalls = TRUE
SYMMETRY Sym
CONSTRAINT Bound
INVARIANT ExhaustedOnce
