\* expect: pass
\* A live process may stall past Dead, then resume and settle: its stale
\* settles leave the row's later life alone. Two runs at once and a rerun
\* are by design here, so NoConcurrentExecution, NoStuckClaim and
\* NoAvoidableRerun are the main run's. A stall is what makes a live process
\* look dead, so crashes and commit errors, which the main run covers, are off.
SPECIFICATION Spec
CONSTANTS
    Procs = {a, b}
    Slots = {1}
    MaxAttempts = 1
    MaxCrashes = 1
    Dead = 2
    HB = 1
    MaxTime = 4
    Crashes = FALSE
    CommitErrors = FALSE
    SettleErrors = TRUE
    MutNoCrashCount = FALSE
    MutBeatStopsOnShutdown = FALSE
    MutNoSettleRetry = FALSE
    MutFoundBeforeCommit = FALSE
    MutNoOrphanRelease = FALSE
    MutRetryFenceClaimed = FALSE
    MutStaleFence = FALSE
    Stalls = TRUE
SYMMETRY Sym
CONSTRAINT Bound
INVARIANTS
    TypeOK
    AttemptsBounded
    AttemptsNonNegative
    CrashLoopBounded
    ExhaustedOnce
    FailedRunsOnExhausted
