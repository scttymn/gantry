\* expect: violates FailedRunsOnExhausted
\* A retried settle fenced on state = 'claimed' only: a failed settle that
\* errored but went through never runs OnExhausted.
SPECIFICATION Spec
CONSTANTS
    Procs = {a, b}
    Slots = {1, 2}
    MaxAttempts = 1
    MaxCrashes = 2
    Dead = 2
    HB = 1
    MaxTime = 5
    Crashes = TRUE
    CommitErrors = TRUE
    SettleErrors = TRUE
    MutNoCrashCount = FALSE
    MutBeatStopsOnShutdown = FALSE
    MutNoSettleRetry = FALSE
    MutFoundBeforeCommit = FALSE
    MutNoOrphanRelease = FALSE
    MutRetryFenceClaimed = TRUE
    MutStaleFence = FALSE
    Stalls = FALSE
SYMMETRY Sym
CONSTRAINT Bound
INVARIANT FailedRunsOnExhausted
