# golangci-lint, at the version ci.yml pins: bin/go go run
# github.com/golangci/golangci-lint/v2/cmd/golangci-lint@<version> run ./...
# Each linter here catches a bug class gantry has had (#54).
version: "2"

run:
  # Paths in the exclusions below are this file's, so the bench modules
  # (GANTRY_DIR=bench, bench/feed) are linted by it too.
  relative-path-mode: cfg

linters:
  default: none
  enable:
    - bodyclose
    - depguard
    - errcheck
    - forbidigo
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - unused
  settings:
    errcheck:
      exclude-functions:
        # A response's write fails when the visitor has gone: no one to tell.
        - (net/http.ResponseWriter).Write
        # Deferred after a commit, where it does nothing but say so.
        - (*database/sql.Tx).Rollback
    staticcheck:
      # staticcheck.conf's, which the staticcheck command and gopls read:
      # staticcheck's defaults less ST1005, and not the QF suggestions,
      # which the command doesn't run either.
      checks: ["all", "-QF*", "-ST1000", "-ST1003", "-ST1005", "-ST1016", "-ST1020", "-ST1021", "-ST1022", "-ST1023"]
    forbidigo:
      # Patterns see a call's function, not its arguments; the exclusions
      # below narrow the first two to the arguments they're about.
      analyze-types: true
      forbid:
        - pattern: ^os\.(Getenv|LookupEnv)$
          msg: read GANTRY_ENV through env.Development or env.Test (internal/env), so every reader agrees on it.
        - pattern: ^(net/)?http\.Header\.(Get|Values)$
          msg: a forwarding header (X-Forwarded-*, Forwarded, X-Real-Ip) is believed only from a trusted proxy; use web.ClientIP, web.Scheme or web.RequestHost (web/proxies.go).
        - pattern: ^(net/)?http\.(DefaultClient|Get|Head|Post|PostForm)$
          msg: http.DefaultClient has no timeout, so a slow server hangs the caller; use an http.Client with a Timeout.
    depguard:
      rules:
        # #34: the development source scanner stays out of what an app
        # links; the gantry CLI runs it (gantry check).
        devcheck:
          files: ["$all", "!$test", "!**/cmd/gantry/**", "!**/devcheck/**"]
          deny:
            - pkg: github.com/scttymn/gantry/devcheck
              desc: devcheck is the development source scanner; keep it out of the packages an app links (#34).
  exclusions:
    # Close, Flush and printing to stdout or stderr: errors only a caller
    # that already failed would see.
    presets: [std-error-handling]
    rules:
      # Tests are left to fail on what they check for errcheck and forbidigo;
      # bodyclose, rowserrcheck and sqlclosecheck run on tests too (#113).
      - path: _test\.go$
        linters: [errcheck, forbidigo]
      # testkit runs in an app's tests, as they do.
      - path: ^testkit/
        linters: [errcheck]
      # An error dropped on purpose is `_ =` in the code, with why. These are
      # the few left here instead:
      # an error page's JSON (the router's, an app's ErrorPage), whose
      # failed write has no one to go to, as ResponseWriter.Write's;
      - linters: [errcheck]
        source: JSON\(w, status,
      # web.Sent has no error to return a failed parse in (a form over its
      # limit, or a malformed one), so it reads what parsed. Returning it
      # changes Sent's signature and every generated controller: not yet.
      - path: ^web/forms\.go$
        linters: [errcheck]
        text: ParseForm
      # web's development checks, which an app's production build leaves
      # out with -tags nodevcheck (#34).
      - path: ^web/development_checks\.go$
        linters: [depguard]
        text: devcheck
      # The read that owns GANTRY_ENV; an app reads its own in config; and
      # any other variable: a literal that can't be "GANTRY_ENV".
      - path: ^(internal/env|bench/feed/config)/
        linters: [forbidigo]
        text: GANTRY_ENV
      - linters: [forbidigo]
        text: GANTRY_ENV
        source: 'os\.(Getenv|LookupEnv)\("([^G"]|G[^A"]|GA[^N"]|GAN[^T"]|GANT[^R"]|GANTR[^Y"]|GANTRY[^_"]|GANTRY_[^E"]|GANTRY_E[^N"]|GANTRY_EN[^V"]|GANTRY_ENV[^"])'
      # The proxy code that decides whether to believe forwarding headers,
      # and any other header: a literal that can't be one's name.
      - path: ^web/proxies\.go$
        linters: [forbidigo]
        text: forwarding header
      - linters: [forbidigo]
        text: forwarding header
        source: '\.(Get|Values)\("(?i:[^xf"]|x[^-]|x-[^fr])'
