name: feed

services:
  app:
    build: { context: ., target: dev }
    expose: ["8080"]
    environment:
      GANTRY_DEV_WARNINGS: ${GANTRY_DEV_WARNINGS:-true}
      GANTRY_DEV_RELOAD: ${GANTRY_DEV_RELOAD:-true}
      MAIL_DRIVER: ${MAIL_DRIVER:-}
      MAIL_FROM: ${MAIL_FROM:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_TLS: ${SMTP_TLS:-}
      SECRET_KEY: ${SECRET_KEY:-}
      SITE_URL: ${SITE_URL:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
    volumes:
      - .:/app
      - data:/data

volumes:
  data:

x-houston:
  health: /up
  commands:
    test: sh -c "go vet ./... && go test ./..."
    console: { dev: go run ./cmd/feed db console, server: /app db console }
