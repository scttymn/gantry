features:
  - name: home
    routes:
      - GET /{$}
    role: public
    visit:
      - path: /
        selector: h1
  - name: health check
    routes:
      - GET /up
      - GET /health
    role: public
    visit:
      - path: /up
      - path: /health
  - name: feed
    routes:
      - GET /feed
      - GET /posts/{id}
    role: public
    visit:
      - path: /feed
  - name: posting
    routes:
      - POST /posts
      - POST /posts/{id}/like
    role: signed-in
  - name: live updates
    routes:
      - GET /live
    role: public
