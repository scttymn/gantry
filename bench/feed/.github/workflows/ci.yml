name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: templ and sqlc, from the Dockerfile's toolchain
        run: |
          docker build -q --target toolchain -t feed-toolchain .
          mkdir -p "$RUNNER_TEMP/bin"
          id=$(docker create feed-toolchain)
          docker cp "$id:/go/bin/templ" "$RUNNER_TEMP/bin/templ"
          docker cp "$id:/usr/local/bin/sqlc" "$RUNNER_TEMP/bin/sqlc"
          docker rm "$id" >/dev/null
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: bin/gantry check --strict
      - run: bin/gantry check --generated
      - name: golangci-lint
        run: docker run --rm -v "$PWD:/app" -w /app feed-toolchain go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0 run ./...
      - name: Tests, of the packages a pull request affects
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE_REF" ]; then
            bin/gantry test --changed --base "origin/$BASE_REF"
          else
            bin/gantry test
          fi
      - run: bin/gantry verify
