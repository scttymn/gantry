# Every pull request and every push to main: gantry's tests as the release runs
# them (pure Go, then as an app builds: with cgo, linked statically), that build
# again under the race detector, then vet, gofmt, staticcheck, govulncheck and
# the bench modules' tests. A broken main shows here, not once the tag exists.
# No path is ignored: a required check has to report on every pull request.
# Actions are pinned by commit, and no checkout keeps the token in .git/config.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: gantry-tests
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Go tests
        run: |
          docker build -q --target toolchain -t gantry-toolchain .
          mkdir -p .cache && [ -f .cache/go.mod ] || printf 'module cache\n' > .cache/go.mod
          docker run --rm --network host -v "$PWD:/src" -w /src \
            -e GANTRY_TEST_POSTGRES_URL="postgres://postgres:gantry-tests@localhost:5432/postgres?sslmode=disable" \
            -e GOMODCACHE=/src/.cache/go/mod -e GOCACHE=/src/.cache/go/cache \
            gantry-toolchain sh -c 'go test ./... &&
              echo "== again, as an app builds: with cgo (SQLite compiled from C), linked statically" &&
              CGO_ENABLED=1 CGO_CFLAGS="-O2 -g -DSQLITE_SOUNDEX -DSQLITE_LIKE_DOESNT_MATCH_BLOBS -DSQLITE_ENABLE_OFFSET_SQL_FUNC -DSQLITE_ENABLE_DBPAGE_VTAB -DSQLITE_ENABLE_GEOPOLY" go test -tags nodynamic,timetzdata,netgo,osusergo,sqlite_omit_load_extension,sqlite_fts5,sqlite_math_functions,sqlite_dbstat,sqlite_stat4 -ldflags "-linkmode external -extldflags -static" ./...'
      - name: Race detector, on the app's build
        # -race needs cgo, which bin/go's toolchain leaves off.
        run: |
          docker run --rm --network host -v "$PWD:/src" -w /src \
            -e GANTRY_TEST_POSTGRES_URL="postgres://postgres:gantry-tests@localhost:5432/postgres?sslmode=disable" \
            -e GOMODCACHE=/src/.cache/go/mod -e GOCACHE=/src/.cache/go/cache \
            gantry-toolchain sh -c 'CGO_ENABLED=1 CGO_CFLAGS="-O2 -g -DSQLITE_SOUNDEX -DSQLITE_LIKE_DOESNT_MATCH_BLOBS -DSQLITE_ENABLE_OFFSET_SQL_FUNC -DSQLITE_ENABLE_DBPAGE_VTAB -DSQLITE_ENABLE_GEOPOLY" go test -race -tags nodynamic,timetzdata,netgo,osusergo,sqlite_omit_load_extension,sqlite_fts5,sqlite_math_functions,sqlite_dbstat,sqlite_stat4 -ldflags "-linkmode external -extldflags -static" ./...'

  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: go vet
        run: bin/go go vet ./...
      - name: gofmt
        run: |
          unformatted=$(bin/go find . -name "*.go" -not -path "./.cache/*" -exec gofmt -l {} +)
          [ -z "$unformatted" ] || { echo "not gofmt'd: $unformatted"; exit 1; }
      - name: staticcheck
        run: bin/go go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
      - name: govulncheck
        # GO-2026-6866 and GO-2026-6860, in golang.org/x/net v0.59.0, go with
        # raising it (#18): until then they're listed, and any other
        # vulnerability gantry's code reaches fails the job.
        run: |
          bin/go go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 -format json ./... > "$RUNNER_TEMP/vulns.json"
          reached=$(jq -rs '[.[].finding | select(.trace[0].function) | .osv] | unique[]' "$RUNNER_TEMP/vulns.json")
          echo "reached: ${reached:-none}"
          unknown=$(printf '%s\n' "$reached" | grep -vx -e GO-2026-6866 -e GO-2026-6860 || true)
          [ -z "$unknown" ] || { echo "vulnerable (https://pkg.go.dev/vuln/<id>): $unknown"; exit 1; }
      - name: The bench modules' tests
        run: |
          GANTRY_DIR=bench bin/go go test ./...
          GANTRY_DIR=bench/feed bin/go go test ./...
