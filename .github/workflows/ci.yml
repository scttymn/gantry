# Every pull request and every push to main: pushes to main run the full suite
# unconditionally; pull requests use internal/ciplan to target only the Go
# packages, cgo pass, race pass, TLA+ specs, fuzz targets, shell scripts,
# linters, bench modules and release build affected by the diff while still
# reporting every required check. CI reaches the tests, so a missing Postgres
# fails them rather than skipping (internal/testenv).
# No path is ignored: a required check has to report on every pull request.
# Actions are pinned by commit, and no checkout keeps the token in .git/config.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A pull request's newer push cancels its older run. Each push to main has a
# group of its own, so none is cancelled or dropped from the queue, and a break
# is pinned to its commit.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      any: ${{ steps.plan.outputs.any }}
      full: ${{ steps.plan.outputs.full }}
      need_tidy: ${{ steps.plan.outputs.need_tidy }}
      need_postgres: ${{ steps.plan.outputs.need_postgres }}
      need_cgo: ${{ steps.plan.outputs.need_cgo }}
      need_race: ${{ steps.plan.outputs.need_race }}
      need_vet: ${{ steps.plan.outputs.need_vet }}
      need_fmt: ${{ steps.plan.outputs.need_fmt }}
      need_lint: ${{ steps.plan.outputs.need_lint }}
      need_lint_cgo: ${{ steps.plan.outputs.need_lint_cgo }}
      need_vuln: ${{ steps.plan.outputs.need_vuln }}
      need_release: ${{ steps.plan.outputs.need_release }}
      doc_gantry_test: ${{ steps.plan.outputs.doc_gantry_test }}
      strict_check: ${{ steps.plan.outputs.strict_check }}
      packages: ${{ steps.plan.outputs.packages }}
      lint_packages: ${{ steps.plan.outputs.lint_packages }}
      bench_modules: ${{ steps.plan.outputs.bench_modules }}
      shell_scripts: ${{ steps.plan.outputs.shell_scripts }}
      tla_specs: ${{ steps.plan.outputs.tla_specs }}
      fuzz_cmd: ${{ steps.plan.outputs.fuzz_cmd }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Plan
        id: plan
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --name-only "origin/${{ github.base_ref }}...HEAD" | bin/go go run ./internal/ciplan/cmd/ciplan -format github | tee -a "$GITHUB_OUTPUT"
          else
            bin/go go run ./internal/ciplan/cmd/ciplan -full -format github | tee -a "$GITHUB_OUTPUT"
          fi

  test:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17@sha256:223efeb196329b55b3b9a13db144956411dbc18e727e59f681c3e0aede6475cf
        env:
          POSTGRES_PASSWORD: gantry-tests
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.plan.outputs.packages != '' || needs.plan.outputs.doc_gantry_test == 'true' || needs.plan.outputs.strict_check == 'true'
        with:
          persist-credentials: false
      - name: Go tests
        if: needs.plan.outputs.packages != '' || needs.plan.outputs.doc_gantry_test == 'true' || needs.plan.outputs.strict_check == 'true'
        env:
          PLAN_PACKAGES: ${{ needs.plan.outputs.packages }}
          PLAN_NEED_CGO: ${{ needs.plan.outputs.need_cgo }}
          PLAN_DOC_GANTRY_TEST: ${{ needs.plan.outputs.doc_gantry_test }}
          PLAN_STRICT_CHECK: ${{ needs.plan.outputs.strict_check }}
        run: |
          docker build -q --target toolchain -t gantry-toolchain .
          mkdir -p .cache && [ -f .cache/go.mod ] || printf 'module cache\n' > .cache/go.mod
          docker run --rm --network host -v "$PWD:/src" -w /src \
            -e GANTRY_TEST_POSTGRES_URL="postgres://postgres:gantry-tests@localhost:5432/postgres?sslmode=disable" \
            -e GOMODCACHE=/src/.cache/go/mod -e GOCACHE=/src/.cache/go/cache -e CI \
            -e PLAN_PACKAGES -e PLAN_NEED_CGO -e PLAN_DOC_GANTRY_TEST -e PLAN_STRICT_CHECK \
            gantry-toolchain sh -c 'set -e
              if [ -n "$PLAN_PACKAGES" ]; then
                go test $PLAN_PACKAGES
              fi
              if [ "$PLAN_DOC_GANTRY_TEST" = "true" ]; then
                go test -run "^(TestDocsCommands|TestDocsCodeSpansCloseOnTheirLine)$" ./cmd/gantry
              fi
              if [ "$PLAN_STRICT_CHECK" = "true" ]; then
                go test -run "^TestGantryPassesStrict$" ./devcheck
              fi
              if [ "$PLAN_NEED_CGO" = "true" ] && [ -n "$PLAN_PACKAGES" ]; then
                echo "== again, as an app builds: with cgo (SQLite compiled from C), linked statically"
                CGO_ENABLED=1 CGO_CFLAGS="-O2 -g -DSQLITE_SOUNDEX -DSQLITE_LIKE_DOESNT_MATCH_BLOBS -DSQLITE_ENABLE_OFFSET_SQL_FUNC -DSQLITE_ENABLE_DBPAGE_VTAB -DSQLITE_ENABLE_GEOPOLY" go test -tags nodynamic,timetzdata,netgo,osusergo,sqlite_omit_load_extension,sqlite_fts5,sqlite_math_functions,sqlite_dbstat,sqlite_stat4 -ldflags "-linkmode external -extldflags -static" $PLAN_PACKAGES
              fi'
      - name: Race detector, on the app's build
        # -race needs cgo, which bin/go's toolchain leaves off.
        if: needs.plan.outputs.need_race == 'true' && needs.plan.outputs.packages != ''
        env:
          PLAN_PACKAGES: ${{ needs.plan.outputs.packages }}
        run: |
          docker run --rm --network host -v "$PWD:/src" -w /src \
            -e GANTRY_TEST_POSTGRES_URL="postgres://postgres:gantry-tests@localhost:5432/postgres?sslmode=disable" \
            -e GOMODCACHE=/src/.cache/go/mod -e GOCACHE=/src/.cache/go/cache -e CI \
            -e PLAN_PACKAGES \
            gantry-toolchain sh -c 'CGO_ENABLED=1 CGO_CFLAGS="-O2 -g -DSQLITE_SOUNDEX -DSQLITE_LIKE_DOESNT_MATCH_BLOBS -DSQLITE_ENABLE_OFFSET_SQL_FUNC -DSQLITE_ENABLE_DBPAGE_VTAB -DSQLITE_ENABLE_GEOPOLY" go test -race -tags nodynamic,timetzdata,netgo,osusergo,sqlite_omit_load_extension,sqlite_fts5,sqlite_math_functions,sqlite_dbstat,sqlite_stat4 -ldflags "-linkmode external -extldflags -static" $PLAN_PACKAGES'

  check:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.plan.outputs.any == 'true'
        with:
          persist-credentials: false
      - name: Modules tidy
        # First, and by name: a module go mod tidy would change fails the
        # steps after it as "updates to go.mod needed", or golangci-lint's
        # "no go files to analyze". A bump at the root changes bench/feed's
        # (replace => ../..) too.
        if: needs.plan.outputs.need_tidy == 'true'
        run: |
          for module in . bench bench/feed bench/sqlite3way; do
            GANTRY_DIR=$module bin/go go mod tidy -diff ||
              { echo "$module isn't tidy: run go mod tidy there (GANTRY_DIR=$module bin/go go mod tidy) and commit its go.mod and go.sum"; exit 1; }
          done
      - name: go vet
        if: needs.plan.outputs.need_vet == 'true' && needs.plan.outputs.lint_packages != ''
        env:
          PLAN_LINT_PACKAGES: ${{ needs.plan.outputs.lint_packages }}
        run: bin/go sh -c "go vet $PLAN_LINT_PACKAGES"
      - name: gofmt
        if: needs.plan.outputs.need_fmt == 'true'
        run: |
          unformatted=$(bin/go find . -name "*.go" -not -path "./.cache/*" -exec gofmt -l {} +)
          [ -z "$unformatted" ] || { echo "not gofmt'd: $unformatted"; exit 1; }
      - name: shellcheck
        # Every shell script git tracks, found by its #! line or its name: an
        # app's bin/gantry's template and goldens too, and one added anywhere
        # (TestEveryScriptIsShellchecked).
        if: needs.plan.outputs.full == 'true' || needs.plan.outputs.shell_scripts != ''
        env:
          PLAN_FULL: ${{ needs.plan.outputs.full }}
          PLAN_SHELL_SCRIPTS: ${{ needs.plan.outputs.shell_scripts }}
        run: |
          if [ "$PLAN_FULL" = "true" ]; then
            bin/shellcheck
          else
            # shellcheck disable=SC2086
            bin/shellcheck $PLAN_SHELL_SCRIPTS
          fi
      - name: TLA+ specs
        # Formal model checks for jobs, web.PageCache and auth (spec/*.tla).
        if: needs.plan.outputs.full == 'true' || needs.plan.outputs.tla_specs != ''
        env:
          PLAN_FULL: ${{ needs.plan.outputs.full }}
          PLAN_TLA_SPECS: ${{ needs.plan.outputs.tla_specs }}
        run: |
          if [ "$PLAN_FULL" = "true" ]; then
            bin/tlc
          else
            # shellcheck disable=SC2086
            bin/tlc $PLAN_TLA_SPECS
          fi
      - name: Fuzz smoke
        if: needs.plan.outputs.fuzz_cmd != ''
        env:
          PLAN_FUZZ_CMD: ${{ needs.plan.outputs.fuzz_cmd }}
        run: bin/go sh -c "$PLAN_FUZZ_CMD"
      - name: golangci-lint
        # .golangci.yml's linters, staticcheck's checks among them, on gantry
        # and the bench modules. Built by the toolchain's Go, as gantry's
        # go.mod needs a Go no older than its own.
        if: needs.plan.outputs.need_lint == 'true'
        env:
          PLAN_LINT_PACKAGES: ${{ needs.plan.outputs.lint_packages }}
          PLAN_BENCH_MODULES: ${{ needs.plan.outputs.bench_modules }}
        run: |
          if [ -n "$PLAN_LINT_PACKAGES" ]; then
            bin/go sh -c "go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0 run $PLAN_LINT_PACKAGES"
          fi
          case " $PLAN_BENCH_MODULES " in
            *" bench "*) GANTRY_DIR=bench bin/go go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0 run ./... ;;
          esac
          case " $PLAN_BENCH_MODULES " in
            *" bench/feed "*) GANTRY_DIR=bench/feed bin/go go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0 run ./... ;;
          esac
      - name: go vet and golangci-lint, on the app's build
        # bin/go builds without cgo, which leaves out db/sqlite_c.go, the
        # SQLite an app runs. This is the app's build, as in the test job.
        if: needs.plan.outputs.need_lint_cgo == 'true' && needs.plan.outputs.lint_packages != ''
        env:
          PLAN_LINT_PACKAGES: ${{ needs.plan.outputs.lint_packages }}
        run: |
          bin/go sh -c "export CGO_ENABLED=1 CGO_CFLAGS=\"-O2 -g -DSQLITE_SOUNDEX -DSQLITE_LIKE_DOESNT_MATCH_BLOBS -DSQLITE_ENABLE_OFFSET_SQL_FUNC -DSQLITE_ENABLE_DBPAGE_VTAB -DSQLITE_ENABLE_GEOPOLY\" GOFLAGS=\"-buildvcs=false -tags=nodynamic,timetzdata,netgo,osusergo,sqlite_omit_load_extension,sqlite_fts5,sqlite_math_functions,sqlite_dbstat,sqlite_stat4\" &&
            go vet $PLAN_LINT_PACKAGES && go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0 run $PLAN_LINT_PACKAGES"
      - name: govulncheck
        # Both builds: the CLI's (bin/go's, without cgo) and an app's. Any
        # vulnerability gantry's code reaches fails the job.
        if: needs.plan.outputs.need_vuln == 'true'
        run: |
          bin/go go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 -format json ./... > "$RUNNER_TEMP/vulns.json"
          bin/go sh -c 'CGO_ENABLED=1 CGO_CFLAGS="-O2 -g -DSQLITE_SOUNDEX -DSQLITE_LIKE_DOESNT_MATCH_BLOBS -DSQLITE_ENABLE_OFFSET_SQL_FUNC -DSQLITE_ENABLE_DBPAGE_VTAB -DSQLITE_ENABLE_GEOPOLY" go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 -format json -tags nodynamic,timetzdata,netgo,osusergo,sqlite_omit_load_extension,sqlite_fts5,sqlite_math_functions,sqlite_dbstat,sqlite_stat4 ./...' >> "$RUNNER_TEMP/vulns.json"
          reached=$(jq -rs '[.[].finding | select(.trace[0].function) | .osv] | unique[]' "$RUNNER_TEMP/vulns.json")
          echo "reached: ${reached:-none}"
          [ -z "$reached" ] || { echo "vulnerable (https://pkg.go.dev/vuln/<id>): $reached"; exit 1; }
      - name: The bench modules' tests
        if: needs.plan.outputs.bench_modules != ''
        env:
          PLAN_BENCH_MODULES: ${{ needs.plan.outputs.bench_modules }}
        run: |
          case " $PLAN_BENCH_MODULES " in
            *" bench "*) GANTRY_DIR=bench bin/go go test ./... ;;
          esac
          case " $PLAN_BENCH_MODULES " in
            *" bench/feed "*) GANTRY_DIR=bench/feed bin/go go test ./... ;;
          esac

  # The release job's build and probe, on a made-up tag: the four CLI binaries
  # cross-compiled by the Dockerfile, and the tag set in them by -X
  # main.releaseVersion, which no test reaches. That a new app builds and
  # passes its tests against the checkout is TestGeneratorMatrix's.
  release-build:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VERSION: v99.99.99
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.plan.outputs.need_release == 'true'
        with:
          persist-credentials: false
      - name: CLI binaries
        if: needs.plan.outputs.need_release == 'true'
        run: docker build --build-arg VERSION="$VERSION" --target release --output type=local,dest=dist .
      - name: The binary's new app requires its release
        if: needs.plan.outputs.need_release == 'true'
        run: |
          probe=$(mktemp -d)
          (cd "$probe" && "$GITHUB_WORKSPACE/dist/gantry-linux-amd64" new probe --skip-houston)
          grep -qx "	github.com/scttymn/gantry $VERSION" "$probe/probe/go.mod" \
            || { echo "a new app's go.mod doesn't require $VERSION:"; cat "$probe/probe/go.mod"; exit 1; }
      - name: The binary pins its Houston release's digests
        # As the release checks them: a Houston bump without its digests
        # (houstonSHA256SUMS) fails here, not once the tag is pushed.
        if: needs.plan.outputs.need_release == 'true'
        run: |
          houston=$(dist/gantry-linux-amd64 houston-release)
          published=$(curl -fsSL --proto =https --retry 3 "https://github.com/scttymn/houston/releases/download/$houston/SHA256SUMS" | grep '  houston-')
          pinned=$(dist/gantry-linux-amd64 houston-release --sha256)
          [ "$pinned" = "$published" ] || { echo "houstonSHA256SUMS (cmd/gantry/new.go) isn't Houston $houston's SHA256SUMS:"; diff <(echo "$pinned") <(echo "$published"); exit 1; }
