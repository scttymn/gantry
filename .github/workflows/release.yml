# A release: pushing a tag like v0.12.0 tests gantry, then publishes a GitHub
# Release with the CLI binaries (gantry-$os-$arch) and SHA256SUMS over them.
# An app's bin/gantry downloads the asset for its go.mod version and checks
# that file. Nothing is published unless the tests pass, and they check that
# latestRelease (cmd/gantry/new.go) was raised to the tag before it was pushed.
# Actions are pinned by commit, and no checkout keeps the token in .git/config.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: gantry-tests
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Go tests
        run: |
          docker build -q --target toolchain -t gantry-toolchain .
          mkdir -p .cache && [ -f .cache/go.mod ] || printf 'module cache\n' > .cache/go.mod
          docker run --rm --network host -v "$PWD:/src" -w /src \
            -e GANTRY_TEST_POSTGRES_URL="postgres://postgres:gantry-tests@localhost:5432/postgres?sslmode=disable" \
            -e GOMODCACHE=/src/.cache/go/mod -e GOCACHE=/src/.cache/go/cache \
            -e GANTRY_RELEASE_TAG="$GITHUB_REF_NAME" \
            gantry-toolchain sh -c 'go test ./... &&
              echo "== again, as an app builds: with cgo (SQLite compiled from C), linked statically" &&
              CGO_ENABLED=1 CGO_CFLAGS="-O2 -g -DSQLITE_SOUNDEX -DSQLITE_LIKE_DOESNT_MATCH_BLOBS -DSQLITE_ENABLE_OFFSET_SQL_FUNC -DSQLITE_ENABLE_DBPAGE_VTAB -DSQLITE_ENABLE_GEOPOLY" go test -tags nodynamic,timetzdata,netgo,osusergo,sqlite_omit_load_extension,sqlite_fts5,sqlite_math_functions,sqlite_dbstat,sqlite_stat4 -ldflags "-linkmode external -extldflags -static" ./...'
      - name: gofmt
        run: |
          unformatted=$(docker run --rm -v "$PWD:/src" -w /src gantry-toolchain sh -c 'gofmt -l $(find . -name "*.go" -not -path "./.cache/*")')
          [ -z "$unformatted" ] || { echo "not gofmt'd: $unformatted"; exit 1; }

  release:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: CLI binaries and SHA256SUMS
        run: |
          docker build --build-arg VERSION="$GITHUB_REF_NAME" --target release --output type=local,dest=dist .
          (cd dist && sha256sum gantry-* > SHA256SUMS)
          cat dist/SHA256SUMS
      - name: The binary's new app requires this release
        run: |
          probe=$(mktemp -d)
          (cd "$probe" && "$GITHUB_WORKSPACE/dist/gantry-linux-amd64" new probe --skip-houston)
          grep -qx "	github.com/scttymn/gantry $GITHUB_REF_NAME" "$probe/probe/go.mod" \
            || { echo "a new app's go.mod doesn't require $GITHUB_REF_NAME:"; cat "$probe/probe/go.mod"; exit 1; }
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
